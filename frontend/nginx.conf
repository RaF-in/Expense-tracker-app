server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rendered at container start from the pod's AUTH0_* env. Uncached by
    # design: a Secret change must reach browsers after a pod restart without
    # a hard refresh. Costs one round trip on cold load — see ARCH (runtime
    # config) for the recorded sub_filter optimization if latency ever matters.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
