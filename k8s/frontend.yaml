apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: expense-tracker
  labels:
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: expense-tracker
  labels:
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: expense-tracker
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: expense-tracker/frontend:local
          imagePullPolicy: IfNotPresent
          # Explicit per-key secretKeyRef, never envFrom: this pod's entrypoint
          # writes environment variables into a publicly served file, so it
          # must never see POSTGRES_PASSWORD or any other Secret key.
          env:
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: AUTH0_DOMAIN
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: AUTH0_CLIENT_ID
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: AUTH0_AUDIENCE
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
