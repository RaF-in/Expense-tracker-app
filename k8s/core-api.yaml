apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: expense-tracker
  labels:
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/name: core-api
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: expense-tracker
  labels:
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/name: core-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: expense-tracker
        app.kubernetes.io/name: core-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: core-api
          image: expense-tracker/core-api:local
          imagePullPolicy: IfNotPresent
          # Explicit per-key secretKeyRef, never envFrom: envFrom would inject
          # every Secret key (including POSTGRES_PASSWORD) into this pod.
          env:
            - name: Auth0__Domain
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: AUTH0_DOMAIN
            - name: Auth0__Audience
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: AUTH0_AUDIENCE
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
