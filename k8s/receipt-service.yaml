apiVersion: v1
kind: Service
metadata:
  name: receipt-service
  namespace: expense-tracker
  labels:
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/name: receipt-service
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: receipt-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-service
  namespace: expense-tracker
  labels:
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/name: receipt-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: expense-tracker
        app.kubernetes.io/name: receipt-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: receipt-service
          image: expense-tracker/receipt-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
